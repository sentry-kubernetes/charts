name: Build and push Chart

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7
        with:
          path: 'main'

      - uses: actions/checkout@v7
        with:
          path: 'gh-pages'

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - run: |
          cd gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git checkout gh-pages

      - name: Package charts
        run: |
          mkdir -p packages
          helm package -u main/charts/clickhouse --destination packages
          helm package -u main/charts/sentry --destination packages
          helm package -u main/charts/sentry-kubernetes --destination packages
          cp packages/*.tgz gh-pages/charts/
          helm repo index --url https://sentry-kubernetes.github.io/charts ./gh-pages/charts

      - name: Commit files
        run: |
          cd gh-pages
          git add .
          git commit -m "Add changes" -a

      - name: Push changes
        uses: ad-m/github-push-action@9870d48124da805820c70ebc6ba563c715551019
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          directory: gh-pages

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v2
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: ./gh-pages/charts
        with:
          keepFiles: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in packages/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          done
