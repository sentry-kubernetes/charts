profiles:
  - errors-only

kafka:
  enabled: true
  kraft:
    enabled: true
  provisioning:
    replicationFactor: 1
  controller:
    replicaCount: 1
  broker:
    replicaCount: 1

redis:
  enabled: true
  master.persistence.enabled: false
  replica.replicaCount: 0

rabbitmq:
  enabled: false

externalClickhouse:
  host: "clickhouse-clickhouse-external.default.svc"
  tcpPort: 9000
  httpPort: 8123
  username: "default"
  password: ""
  database: "default"
  singleNode: true
