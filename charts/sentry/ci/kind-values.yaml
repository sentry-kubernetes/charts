profiles:
  - errors-only

user:
  password: ci-test-password

kafka:
  enabled: true
  replicaCount: 1
  provisioning:
    replicationFactor: 1
    numPartitions: 1
  persistence:
    enabled: false

redis:
  enabled: true
  architecture: standalone
  persistence:
    enabled: false

externalClickhouse:
  host: "clickhouse-clickhouse-external.default.svc"
  tcpPort: 9000
  httpPort: 8123
  username: "default"
  password: ""
  database: "default"
  singleNode: true
