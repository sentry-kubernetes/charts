{{- if and (not .Values.kafka.enabled) .Values.externalKafka.provisioning.enabled }}
{{- $provisioning := .Values.externalKafka.provisioning }}

{{- $brokers := list }}
{{- if .Values.externalKafka.cluster }}
{{- range .Values.externalKafka.cluster }}
{{- $brokers = append $brokers (dict "host" .host "port" (int .port)) }}
{{- end }}
{{- else }}
{{- $brokers = append $brokers (dict "host" .Values.externalKafka.host "port" (int .Values.externalKafka.port)) }}
{{- end }}

{{- $image := printf "%s:%s" ($provisioning.image.repository | default "apache/kafka") ($provisioning.image.tag | default "3.7.1") }}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-kafka-provisioning
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: kafka-provisioning
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    "helm.sh/hook-weight": "0"
spec:
  {{- if .Values.hooks.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ .Values.hooks.activeDeadlineSeconds }}
  {{- end}}
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: kafka-provisioning
    spec:
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 0
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if $provisioning.nodeSelector }}
      nodeSelector:
{{ toYaml $provisioning.nodeSelector | indent 8 }}
      {{- else if .Values.global.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.global.nodeSelector | indent 8 }}
      {{- end }}
      {{- if $provisioning.tolerations }}
      tolerations:
{{ toYaml $provisioning.tolerations | indent 8 }}
      {{- else if .Values.global.tolerations }}
      tolerations:
{{ toYaml .Values.global.tolerations | indent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-kafka
          image: {{ $image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          command:
            - /bin/bash
            - /scripts/wait-for-kafka.sh
          {{- if $provisioning.resources }}
          resources:
{{ toYaml $provisioning.resources | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      containers:
        - name: kafka-provisioning
          image: {{ $image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          {{- if .Values.externalKafka.sasl.existingSecret }}
          env:
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalKafka.sasl.existingSecret }}
                  key: {{ (.Values.externalKafka.sasl.existingSecretKeys).mechanism | default "mechanism" }}
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalKafka.sasl.existingSecret }}
                  key: {{ (.Values.externalKafka.sasl.existingSecretKeys).username | default "username" }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalKafka.sasl.existingSecret }}
                  key: {{ (.Values.externalKafka.sasl.existingSecretKeys).password | default "password" }}
          {{- end }}
          command:
            - /bin/bash
            - /scripts/provision.sh
          {{- if $provisioning.resources }}
          resources:
{{ toYaml $provisioning.resources | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
{{- if $provisioning.volumeMounts }}
{{ toYaml $provisioning.volumeMounts | indent 12 }}
{{- end }}
{{- if .Values.global.volumeMounts }}
{{ toYaml .Values.global.volumeMounts | indent 12 }}
{{- end }}
{{- if $provisioning.sidecars }}
{{ toYaml $provisioning.sidecars | indent 8 }}
{{- end }}
{{- if .Values.global.sidecars }}
{{ toYaml .Values.global.sidecars | indent 8 }}
{{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-kafka-provisioning-scripts
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
{{- if $provisioning.volumes }}
{{ toYaml $provisioning.volumes | indent 8 }}
{{- end }}
{{- if .Values.global.volumes }}
{{ toYaml .Values.global.volumes | indent 8 }}
{{- end }}
{{- end }}
