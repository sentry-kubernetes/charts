{{- if and .Values.sentry.taskWorker.enabled .Values.serviceAccount.enabled (not .Values.serviceAccount.shared) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}-taskworker
  labels:
    {{- include "sentry.component.labels" (dict "component" "taskworker" "ctx" .) | nindent 4 }}
{{- if .Values.serviceAccount.annotations }}
  annotations: {{ toYaml .Values.serviceAccount.annotations | nindent 4 }}
{{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}


