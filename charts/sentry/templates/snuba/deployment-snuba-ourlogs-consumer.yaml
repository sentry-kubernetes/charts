{{- if .Values.snuba.ourlogsConsumer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "sentry.fullname" . }}-snuba-ourlogs-consumer
  labels:
    app: {{ template "sentry.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    app.kubernetes.io/managed-by: "Helm"
  {{- if .Values.asHook }}
  {{- /* Add the Helm annotations so that deployment after asHook from true to false works */}}
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "12"
  {{- end }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
        app: {{ template "sentry.fullname" . }}
        release: "{{ .Release.Name }}"
        role: snuba-ourlogs-consumer
  replicas: {{ .Values.snuba.ourlogsConsumer.replicas }}
  template:
    metadata:
      annotations:
        checksum/snubaSettingsPy: {{ .Values.config.snubaSettingsPy | sha256sum }}
        checksum/config.yaml: {{ include "sentry.snuba.config" . | sha256sum }}
        {{- if .Values.snuba.ourlogsConsumer.annotations }}
{{ toYaml .Values.snuba.ourlogsConsumer.annotations | indent 8 }}
        {{- end }}
      labels:
        app: {{ template "sentry.fullname" . }}
        release: "{{ .Release.Name }}"
        role: snuba-ourlogs-consumer
        {{- if .Values.snuba.ourlogsConsumer.podLabels }}
{{ toYaml .Values.snuba.ourlogsConsumer.podLabels | indent 8 }}
        {{- end }}
    spec:
      affinity:
      {{- if .Values.snuba.ourlogsConsumer.affinity }}
{{ toYaml .Values.snuba.ourlogsConsumer.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.snuba.ourlogsConsumer.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.snuba.ourlogsConsumer.nodeSelector | indent 8 }}
      {{- else if .Values.global.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.global.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.snuba.ourlogsConsumer.tolerations }}
      tolerations:
{{ toYaml .Values.snuba.ourlogsConsumer.tolerations | indent 8 }}
      {{- else if .Values.global.tolerations }}
      tolerations:
{{ toYaml .Values.global.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.snuba.ourlogsConsumer.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml .Values.snuba.ourlogsConsumer.topologySpreadConstraints | indent 8 }}
      {{- end }}
      {{- if .Values.images.snuba.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.images.snuba.imagePullSecrets | indent 8 }}
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy | quote }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
{{ toYaml .Values.dnsConfig | indent 8 }}
      {{- end }}
      {{- if .Values.snuba.ourlogsConsumer.securityContext }}
      securityContext:
{{ toYaml .Values.snuba.ourlogsConsumer.securityContext | indent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}-snuba
        image: "{{ template "snuba.image" . }}"
        imagePullPolicy: {{ default "IfNotPresent" .Values.images.snuba.pullPolicy }}
        command:
          - "snuba"
          - {{ if .Values.snuba.rustConsumer -}}"rust-consumer"{{- else -}}"consumer"{{- end }}
          - "--storage"
          - "eap_items"
          - "--consumer-group"
          - "snuba-ourlogs-consumers"
          {{- if .Values.snuba.ourlogsConsumer.autoOffsetReset }}
          - "--auto-offset-reset"
          - "{{ .Values.snuba.ourlogsConsumer.autoOffsetReset }}"
          {{- end }}
          {{- if .Values.snuba.ourlogsConsumer.maxBatchSize }}
          - "--max-batch-size"
          - "{{ .Values.snuba.ourlogsConsumer.maxBatchSize }}"
          {{- end }}
          {{- if .Values.snuba.ourlogsConsumer.processes }}
          - "--processes"
          - "{{ .Values.snuba.ourlogsConsumer.processes }}"
          {{- end }}
          {{- if .Values.snuba.ourlogsConsumer.inputBlockSize }}
          - "--input-block-size"
          - "{{ .Values.snuba.ourlogsConsumer.inputBlockSize }}"
          {{- end }}
          {{- if .Values.snuba.ourlogsConsumer.outputBlockSize }}
          - "--output-block-size"
          - "{{ .Values.snuba.ourlogsConsumer.outputBlockSize }}"
          {{- end }}
          {{- if .Values.snuba.ourlogsConsumer.maxBatchTimeMs }}
          - "--max-batch-time-ms"
          - "{{ .Values.snuba.ourlogsConsumer.maxBatchTimeMs }}"
          {{- end }}
          {{- if .Values.snuba.ourlogsConsumer.queuedMaxMessagesKbytes }}
          - "--queued-max-messages-kbytes"
          - "{{ .Values.snuba.ourlogsConsumer.queuedMaxMessagesKbytes }}"
          {{- end }}
          {{- if .Values.snuba.ourlogsConsumer.queuedMinMessages }}
          - "--queued-min-messages"
          - "{{ .Values.snuba.ourlogsConsumer.queuedMinMessages }}"
          {{- end }}
          {{- if .Values.snuba.ourlogsConsumer.noStrictOffsetReset }}
          - "--no-strict-offset-reset"
          {{- end }}
          {{- if .Values.snuba.ourlogsConsumer.livenessProbe.enabled }}
          - "--health-check-file"
          - "/tmp/health.txt"
          {{- end }}
        {{- if .Values.snuba.ourlogsConsumer.livenessProbe.enabled }}
        livenessProbe:
          exec:
            command:
              - rm
              - /tmp/health.txt
          initialDelaySeconds: {{ .Values.snuba.ourlogsConsumer.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.snuba.ourlogsConsumer.livenessProbe.periodSeconds }}
        {{- end }}
        ports:
        - containerPort: {{ template "snuba.port" }}
        env:
{{ include "sentry.snuba.env" . | indent 8 }}
{{- if .Values.snuba.ourlogsConsumer.env }}
{{ toYaml .Values.snuba.ourlogsConsumer.env | indent 8 }}
{{- end }}
        envFrom:
        - secretRef:
            name: {{ template "sentry.fullname" . }}-snuba-env
        volumeMounts:
        - mountPath: /etc/snuba
          name: config
          readOnly: true
{{- if .Values.snuba.ourlogsConsumer.volumeMounts }}
{{ toYaml .Values.snuba.ourlogsConsumer.volumeMounts | indent 8 }}
{{- end }}
        resources:
{{ toYaml .Values.snuba.ourlogsConsumer.resources | indent 12 }}
{{- if .Values.snuba.ourlogsConsumer.containerSecurityContext }}
        securityContext:
{{ toYaml .Values.snuba.ourlogsConsumer.containerSecurityContext | indent 12 }}
{{- end }}
{{- if .Values.snuba.ourlogsConsumer.sidecars }}
{{ toYaml .Values.snuba.ourlogsConsumer.sidecars | indent 6 }}
{{- end }}
{{- if .Values.global.sidecars }}
{{ toYaml .Values.global.sidecars | indent 6 }}
{{- end }}
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.serviceAccount.name }}-snuba
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ template "sentry.fullname" . }}-snuba
{{- if .Values.snuba.ourlogsConsumer.volumes }}
{{ toYaml .Values.snuba.ourlogsConsumer.volumes | indent 8 }}
{{- end }}
{{- if .Values.global.volumes }}
{{ toYaml .Values.global.volumes | indent 8 }}
{{- end }}
{{- end }}
