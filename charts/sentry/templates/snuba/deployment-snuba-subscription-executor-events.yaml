{{- if .Values.snuba.subscriptionExecutorEvents.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "sentry.fullname" . }}-snuba-subscription-executor-events
  labels:
    app: {{ template "sentry.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    app.kubernetes.io/managed-by: "Helm"
  {{- if .Values.asHook }}
  {{- /* Add the Helm annotations so that deployment after asHook from true to false works */}}
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "18"
  {{- end }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
        app: {{ template "sentry.fullname" . }}
        release: "{{ .Release.Name }}"
        role: snuba-subscription-executor-events
  replicas: {{ .Values.snuba.subscriptionExecutorEvents.replicas }}
  template:
    metadata:
      annotations:
        checksum/snubaSettingsPy: {{ .Values.config.snubaSettingsPy | sha256sum }}
        checksum/config.yaml: {{ include "sentry.snuba.config" . | sha256sum }}
        {{- if .Values.snuba.subscriptionExecutorEvents.annotations }}
{{ toYaml .Values.snuba.subscriptionExecutorEvents.annotations | indent 8 }}
        {{- end }}
      labels:
        app: {{ template "sentry.fullname" . }}
        release: "{{ .Release.Name }}"
        role: snuba-subscription-executor-events
        {{- if .Values.snuba.subscriptionExecutorEvents.podLabels }}
{{ toYaml .Values.snuba.subscriptionExecutorEvents.podLabels | indent 8 }}
        {{- end }}
    spec:
      affinity:
      {{- if .Values.snuba.subscriptionExecutorEvents.affinity }}
{{ toYaml .Values.snuba.subscriptionExecutorEvents.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.snuba.subscriptionExecutorEvents.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.snuba.subscriptionExecutorEvents.nodeSelector | indent 8 }}
      {{- else if .Values.global.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.global.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.snuba.subscriptionExecutorEvents.tolerations }}
      tolerations:
{{ toYaml .Values.snuba.subscriptionExecutorEvents.tolerations | indent 8 }}
      {{- else if .Values.global.tolerations }}
      tolerations:
{{ toYaml .Values.global.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.snuba.subscriptionExecutorEvents.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml .Values.snuba.subscriptionExecutorEvents.topologySpreadConstraints | indent 8 }}
      {{- end }}
      {{- if .Values.images.snuba.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.images.snuba.imagePullSecrets | indent 8 }}
      {{- end }}
      {{- if .Values.snuba.subscriptionExecutorEvents.securityContext }}
      securityContext:
{{ toYaml .Values.snuba.subscriptionExecutorEvents.securityContext | indent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}-snuba
        image: "{{ template "snuba.image" . }}"
        imagePullPolicy: {{ default "IfNotPresent" .Values.images.snuba.pullPolicy }}
        command:
          - "snuba"
          - "subscriptions-executor"
          {{- if .Values.snuba.subscriptionExecutorEvents.autoOffsetReset }}
          - "--auto-offset-reset"
          - "{{ .Values.snuba.subscriptionExecutorEvents.autoOffsetReset }}"
          {{- end }}
          - "--dataset=events"
          - "--entity=events"
          {{- if .Values.snuba.subscriptionExecutorEvents.noStrictOffsetReset }}
          - "--no-strict-offset-reset"
          {{- end }}
          - "--consumer-group=snuba-events-subscription-executor"
        {{- if .Values.snuba.subscriptionExecutorEvents.livenessProbe.enabled }}
        livenessProbe:
          exec:
            command:
              - rm
              - /tmp/health.txt
          initialDelaySeconds: {{ .Values.snuba.subscriptionExecutorEvents.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.snuba.subscriptionExecutorEvents.livenessProbe.periodSeconds }}
        {{- end }}
        ports:
        - containerPort: {{ template "snuba.port" }}
        env:
{{ include "sentry.snuba.env" . | indent 8 }}
{{- if .Values.snuba.subscriptionExecutorEvents.env }}
{{ toYaml .Values.snuba.subscriptionExecutorEvents.env | indent 8 }}
{{- end }}
        envFrom:
        - secretRef:
            name: {{ template "sentry.fullname" . }}-snuba-env
        volumeMounts:
        - mountPath: /etc/snuba
          name: config
          readOnly: true
{{- if .Values.snuba.subscriptionExecutorEvents.volumeMounts }}
{{ toYaml .Values.snuba.subscriptionExecutorEvents.volumeMounts | indent 8 }}
{{- end }}
        resources:
{{ toYaml .Values.snuba.subscriptionExecutorEvents.resources | indent 12 }}
{{- if .Values.snuba.subscriptionExecutorEvents.containerSecurityContext }}
        securityContext:
{{ toYaml .Values.snuba.subscriptionExecutorEvents.containerSecurityContext | indent 12 }}
{{- end }}
{{- if .Values.snuba.subscriptionExecutorEvents.sidecars }}
{{ toYaml .Values.snuba.subscriptionExecutorEvents.sidecars | indent 6 }}
{{- end }}
{{- if .Values.global.sidecars }}
{{ toYaml .Values.global.sidecars | indent 6 }}
{{- end }}
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.serviceAccount.name }}-snuba
      {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ template "sentry.fullname" . }}-snuba
{{- if .Values.snuba.subscriptionExecutorEvents.volumes }}
{{ toYaml .Values.snuba.subscriptionExecutorEvents.volumes | indent 6 }}
{{- end }}
{{- if .Values.global.volumes }}
{{ toYaml .Values.global.volumes | indent 6 }}
{{- end }}
{{- end }}
