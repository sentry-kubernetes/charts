{{- if .Values.pgbouncer.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "sentry.fullname" . }}-pgbouncer
  labels:
    app: {{ template "sentry.fullname" . }}-pgbouncer
    {{- include "sentry.component.labels" (dict "component" "pgbouncer" "ctx" .) | nindent 4 }}
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  selector:
    matchLabels:
      app: {{ template "sentry.fullname" . }}-pgbouncer
  {{- if .Values.pgbouncer.updateStrategy }}
  strategy:
    {{ toYaml .Values.pgbouncer.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ template "sentry.fullname" . }}-pgbouncer
        {{- include "sentry.component.labels" (dict "component" "pgbouncer" "ctx" .) | nindent 8 }}
    spec:
      containers:
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image.repository }}:{{ .Values.pgbouncer.image.tag }}
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          resources:
            {{ toYaml .Values.pgbouncer.resources | nindent 12 }}
          env:
            {{- if .Values.pgbouncer.env }}
            {{ toYaml .Values.pgbouncer.env | nindent 12 }}
            {{- end }}
            {{ include "sentry.pgbouncer.env" . | nindent 12 }}
            - name: DATABASE_URL
              value: "postgres://$(POSTGRESQL_USERNAME):$(POSTGRESQL_PASSWORD)@$(POSTGRESQL_HOST):$(POSTGRESQL_PORT)/$(PGBOUNCER_DATABASE)"
            - name: LISTEN_PORT
              value: "5432"
            - name: AUTH_TYPE
              value: {{ .Values.pgbouncer.authType | quote }}
            - name: ADMIN_USERS
              value: "$(POSTGRESQL_USERNAME)"
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.poolSize | quote }}
            - name: SERVER_RESET_QUERY
              value: "SELECT pg_advisory_unlock_all()"
            - name: SERVER_RESET_QUERY_ALWAYS
              value: "1"
            - name: UNIX_SOCKET_DIR
              value: "/tmp"
          ports:
            - containerPort: 5432
              name: pgbouncer
              protocol: TCP
{{- if or .Values.pgbouncer.volumeMounts .Values.global.volumeMounts }}
          volumeMounts:
{{- end }}
{{- if .Values.pgbouncer.volumeMounts }}
{{ toYaml .Values.pgbouncer.volumeMounts | indent 12 }}
{{- end }}
{{- if .Values.global.volumeMounts }}
{{ toYaml .Values.global.volumeMounts | indent 12 }}
{{- end }}
{{- if .Values.pgbouncer.sidecars }}
{{ toYaml .Values.pgbouncer.sidecars | indent 8 }}
{{- end }}
{{- if .Values.global.sidecars }}
{{ toYaml .Values.global.sidecars | indent 8 }}
{{- end }}
      {{- if .Values.pgbouncer.nodeSelector }}
      nodeSelector:
        {{ toYaml .Values.pgbouncer.nodeSelector | nindent 8 }}
      {{- else if .Values.global.nodeSelector }}
      nodeSelector:
        {{ toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.pgbouncer.tolerations }}
      tolerations:
        {{ toYaml .Values.pgbouncer.tolerations | nindent 8 }}
      {{- else if .Values.global.tolerations }}
      tolerations:
        {{ toYaml .Values.global.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.pgbouncer.affinity }}
      affinity:
        {{ toYaml .Values.pgbouncer.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.pgbouncer.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{ toYaml .Values.pgbouncer.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- if .Values.pgbouncer.priorityClassName }}
      priorityClassName: "{{ .Values.pgbouncer.priorityClassName }}"
      {{- end }}
      terminationGracePeriodSeconds: 10
{{- if or .Values.pgbouncer.volumes .Values.global.volumes }}
      volumes:
{{- end }}
{{- if .Values.pgbouncer.volumes }}
{{ toYaml .Values.pgbouncer.volumes | indent 8 }}
{{- end }}
{{- if .Values.global.volumes }}
{{ toYaml .Values.global.volumes | indent 8 }}
{{- end }}
{{- end }}
