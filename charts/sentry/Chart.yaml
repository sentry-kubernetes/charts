apiVersion: v2
name: sentry
description: A Helm chart for Kubernetes
type: application
version: 27.2.3
# renovate image=ghcr.io/getsentry/sentry
appVersion: 25.8.0
dependencies:
  - name: memcached
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 7.9.7
    condition: sourcemaps.enabled
  - name: redis
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 22.0.7
    condition: redis.enabled
  - name: kafka
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 29.3.14
    condition: kafka.enabled
  - name: clickhouse
    repository: https://sentry-kubernetes.github.io/charts
    version: 4.0.1
    condition: clickhouse.enabled
  - name: zookeeper
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 13.8.7
    condition: zookeeper.enabled
  - name: rabbitmq
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 16.0.14
    alias: rabbitmq
    condition: rabbitmq.enabled
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 16.7.26
    condition: postgresql.enabled
  - name: nginx
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 21.1.23
    condition: nginx.enabled
maintainers:
  - name: sentry-kubernetes
icon: https://raw.githubusercontent.com/sentry-kubernetes/charts/refs/heads/develop/docs/logo.png
home: https://github.com/sentry-kubernetes/charts
sources:
  - https://github.com/sentry-kubernetes/charts/tree/develop/charts/sentry
